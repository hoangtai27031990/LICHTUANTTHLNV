<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lịch Công Tác Tuần</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --accent: #e63946;
    --accent2: #f4a261;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --border: #dde3ec;
    --success: #2d9c6b;
    --row-even: #f7fafd;
    --shadow: 0 2px 16px rgba(26,58,92,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Be Vietnam Pro', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--primary);
    color: white;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 64px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: sticky; top: 0; z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-logo {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    letter-spacing: 0.5px;
  }
  .header-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .btn {
    padding: 8px 18px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-outline {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,0.5);
    color: white;
  }
  .btn-outline:hover { background: rgba(255,255,255,0.1); }
  .btn-accent {
    background: var(--accent);
    color: white;
  }
  .btn-accent:hover { background: #c1121f; }
  .btn-primary {
    background: var(--primary);
    color: white;
  }
  .btn-primary:hover { background: #122a44; }
  .btn-success {
    background: var(--success);
    color: white;
  }
  .btn-success:hover { background: #227a54; }
  .btn-danger {
    background: #e63946;
    color: white;
    padding: 6px 12px;
    font-size: 12px;
  }
  .btn-sm {
    padding: 5px 12px;
    font-size: 12px;
  }
  .user-badge {
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    display: flex; align-items: center; gap: 6px;
  }
  .user-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }

  /* MAIN */
  .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

  /* WEEK NAV */
  .week-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px;
    background: var(--card);
    border-radius: 12px;
    padding: 16px 24px;
    box-shadow: var(--shadow);
  }
  .week-title {
    font-size: 17px; font-weight: 600; color: var(--primary);
  }
  .week-range { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .week-nav-btns { display: flex; gap: 8px; align-items: center; }
  .nav-btn {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: white;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    color: var(--primary);
  }
  .nav-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

  /* VIEW TABS */
  .view-tabs {
    display: flex; gap: 4px;
    background: var(--border);
    border-radius: 8px;
    padding: 3px;
  }
  .view-tab {
    padding: 6px 16px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    font-family: 'Be Vietnam Pro', sans-serif;
    background: transparent;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .view-tab.active { background: white; color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,0.1); }

  /* TABLE VIEW */
  .table-wrap {
    background: var(--card);
    border-radius: 12px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--primary); color: white; }
  thead th {
    padding: 13px 16px;
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.15s; }
  tbody tr:nth-child(even) { background: var(--row-even); }
  tbody tr:hover { background: #e8f0f9; }
  tbody td {
    padding: 12px 16px;
    font-size: 13.5px;
    vertical-align: middle;
  }
  .td-ngay { font-weight: 600; color: var(--primary); white-space: nowrap; }
  .td-thu { color: var(--text-muted); font-size: 12px; }
  .td-time {
    background: #eef3fb;
    color: var(--primary);
    border-radius: 4px;
    padding: 2px 8px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    display: inline-block;
  }
  .td-time.ca-ngay { background: #fef3c7; color: #92400e; }
  .td-noidung { font-weight: 500; }
  .td-chutri { color: var(--text-muted); font-size: 13px; }
  .td-actions { display: flex; gap: 6px; }
  .empty-row td { text-align: center; padding: 48px; color: var(--text-muted); font-size: 14px; }

  /* CALENDAR VIEW */
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
  }
  .cal-day {
    background: var(--card);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
    min-height: 160px;
  }
  .cal-day-header {
    background: var(--primary);
    color: white;
    padding: 10px 12px;
    text-align: center;
  }
  .cal-thu { font-size: 11px; opacity: 0.8; }
  .cal-date { font-size: 20px; font-weight: 700; line-height: 1.2; }
  .cal-day-header.today { background: var(--accent); }
  .cal-events { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .cal-event {
    background: #eef3fb;
    border-left: 3px solid var(--primary);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 11.5px;
  }
  .cal-event-time { color: var(--text-muted); font-size: 10.5px; margin-bottom: 2px; }
  .cal-event-title { font-weight: 500; color: var(--text); line-height: 1.3; }
  .cal-empty { color: var(--border); font-size: 11px; text-align: center; padding: 16px 8px; }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: white;
    border-radius: 14px;
    padding: 28px;
    width: 480px;
    max-width: 95vw;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-title {
    font-size: 18px; font-weight: 700; color: var(--primary);
    margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-close {
    width: 28px; height: 28px;
    border-radius: 50%; border: none;
    background: var(--border); cursor: pointer;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
    color: var(--text-muted);
  }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; display: block; text-transform: uppercase; letter-spacing: 0.4px; }
  .form-input {
    width: 100%; padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Be Vietnam Pro', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
    color: var(--text);
  }
  .form-input:focus { border-color: var(--primary); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* PIN MODAL */
  .pin-inputs { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
  .pin-input {
    width: 52px; height: 56px;
    border: 2px solid var(--border);
    border-radius: 10px;
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    outline: none;
    transition: border-color 0.2s;
    font-family: 'Be Vietnam Pro', sans-serif;
  }
  .pin-input:focus { border-color: var(--primary); }
  .pin-error { color: var(--accent); font-size: 13px; text-align: center; margin-top: -10px; margin-bottom: 10px; min-height: 20px; }

  /* USERS MODAL */
  .users-list { max-height: 280px; overflow-y: auto; margin-bottom: 16px; }
  .user-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .user-info { font-size: 14px; }
  .user-name { font-weight: 600; }
  .user-pin { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .admin-badge {
    background: #fef3c7; color: #92400e;
    font-size: 10px; font-weight: 600;
    padding: 2px 8px; border-radius: 10px;
    margin-left: 8px;
  }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--primary); color: white;
    padding: 12px 20px; border-radius: 10px;
    font-size: 14px; font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    z-index: 999;
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--accent); }

  /* LOADING */
  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 60px; color: var(--text-muted); font-size: 14px; gap: 10px;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
  @media (max-width: 480px) {
    .btn-label-full { display: none; }
    .btn-label-short { display: inline !important; }
  }

  @media (max-width: 768px) {
    /* HEADER mobile */
    .header { padding: 0 12px; height: auto; min-height: 56px; flex-wrap: wrap; gap: 8px; padding-top: 8px; padding-bottom: 8px; }
    .header-logo { font-size: 15px; }
    .header-sub { display: none; }
    .header-right { gap: 6px; flex-wrap: wrap; }
    .btn { padding: 6px 10px; font-size: 12px; }
    .user-badge { padding: 5px 10px; font-size: 12px; }

    /* MAIN */
    .main { padding: 12px 10px; }

    /* WEEK NAV */
    .week-nav { padding: 12px 14px; flex-direction: column; align-items: flex-start; gap: 10px; }
    .week-title { font-size: 15px; }
    .week-nav > div:last-child { width: 100%; justify-content: space-between; }
    .view-tabs { flex: 1; }
    .view-tab { padding: 5px 12px; font-size: 12px; }

    /* TABLE: ẩn bớt cột, dùng card style */
    .table-wrap { border-radius: 10px; overflow-x: auto; }
    table { min-width: 480px; }
    thead th { padding: 10px 10px; font-size: 12px; }
    tbody td { padding: 10px 10px; font-size: 12px; }
    thead th:nth-child(5), tbody td:nth-child(5) { display: none; }
    .td-time { font-size: 11px; padding: 2px 6px; }

    /* CALENDAR: 1 cột */
    .calendar-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .cal-day-header { padding: 8px; }
    .cal-date { font-size: 16px; }
    .cal-event { font-size: 11px; padding: 4px 6px; }

    /* MODAL full screen */
    .modal { width: 95vw; padding: 20px 16px; border-radius: 12px; max-height: 90vh; overflow-y: auto; }
    .modal[style*="360px"] { width: 92vw; }
    .form-row { grid-template-columns: 1fr; }
    .form-input { font-size: 14px; padding: 10px; }

    /* PIN modal */
    .pin-input { width: 44px; height: 48px; font-size: 20px; }
    .pin-inputs { gap: 8px; }

    /* USERS modal */
    .users-list { max-height: 200px; }
  }

  @media (max-width: 400px) {
    .calendar-grid { grid-template-columns: 1fr; }
    .header-logo { font-size: 13px; }
    table { min-width: 360px; }
    thead th:nth-child(6), tbody td:nth-child(6) { display: none; }
    thead th:nth-child(7), tbody td:nth-child(7) { display: none; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div>
      <div class="header-logo">📋 Lịch Công Tác Tuần</div>
      <div class="header-sub">Trung Tâm Huấn Luyện Nghiệp Vụ</div>
    </div>
  </div>
  <div class="header-right">
    <div id="userBadge" class="user-badge hidden">
      <div class="user-dot"></div>
      <span id="userName">--</span>
    </div>
    <button id="btnAdmin" class="btn btn-outline hidden" onclick="openUsersModal()"><span class="btn-label-full">👥 Quản lý người dùng</span><span class="btn-label-short hidden">👥</span></button>
    <button id="btnAddLich" class="btn btn-accent hidden" onclick="openAddModal()">+ Thêm lịch</button>
    <button id="btnLogin" class="btn btn-outline" onclick="openPinModal()">🔐 Đăng nhập</button>
    <button id="btnLogout" class="btn btn-outline hidden" onclick="logout()">Đăng xuất</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- WEEK NAV -->
  <div class="week-nav">
    <div>
      <div class="week-title" id="weekTitle">--</div>
      <div class="week-range" id="weekRange">--</div>
    </div>
    <div style="display:flex;gap:16px;align-items:center;">
      <div class="view-tabs">
        <button class="view-tab active" onclick="setView('table')">📋 Bảng</button>
        <button class="view-tab" onclick="setView('calendar')">📅 Lịch</button>
      </div>
      <div class="week-nav-btns">
        <button class="nav-btn" onclick="changeWeek(-1)">←</button>
        <button class="nav-btn" onclick="changeWeek(0)" title="Tuần hiện tại">●</button>
        <button class="nav-btn" onclick="changeWeek(1)">→</button>
      </div>
    </div>
  </div>

  <!-- TABLE VIEW -->
  <div id="tableView" class="table-wrap">
    <div class="loading" id="loadingTable"><div class="spinner"></div> Đang tải dữ liệu...</div>
    <table id="lichTable" class="hidden">
      <thead>
        <tr>
          <th>Ngày</th>
          <th>Thứ</th>
          <th>Thời gian</th>
          <th>Nội dung</th>
          <th>Địa điểm</th>
          <th>Chủ trì</th>
          <th>Thành phần</th>
          <th id="actionsCol" class="hidden">Thao tác</th>
        </tr>
      </thead>
      <tbody id="lichBody"></tbody>
    </table>
  </div>

  <!-- CALENDAR VIEW -->
  <div id="calendarView" class="hidden">
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

</div>

<!-- PIN MODAL -->
<div class="modal-overlay" id="pinModal">
  <div class="modal" style="width:360px;">
    <div class="modal-title">
      🔐 Nhập mã PIN
      <button class="modal-close" onclick="closePinModal()">✕</button>
    </div>
    <p style="font-size:13px;color:var(--text-muted);margin-bottom:8px;text-align:center;">Nhập PIN để chỉnh sửa lịch công tác</p>
    <div class="pin-inputs">
      <input class="pin-input" maxlength="1" type="password" id="p1" oninput="pinNext(this,'p2')">
      <input class="pin-input" maxlength="1" type="password" id="p2" oninput="pinNext(this,'p3')">
      <input class="pin-input" maxlength="1" type="password" id="p3" oninput="pinNext(this,'p4')">
      <input class="pin-input" maxlength="1" type="password" id="p4" oninput="pinNext(this,null)">
    </div>
    <div class="pin-error" id="pinError"></div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="color:var(--text-muted);border-color:var(--border);" onclick="closePinModal()">Hủy</button>
      <button class="btn btn-primary" onclick="verifyPin()">Xác nhận</button>
    </div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="lichModal">
  <div class="modal">
    <div class="modal-title">
      <span id="modalTitle">➕ Thêm lịch mới</span>
      <button class="modal-close" onclick="closeLichModal()">✕</button>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Ngày</label>
        <input class="form-input" type="date" id="fNgay">
      </div>
      <div class="form-group">
        <label class="form-label">Thứ</label>
        <input class="form-input" type="text" id="fThu" placeholder="Thứ Hai" readonly style="background:#f9f9f9;">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Thời gian</label>
      <input class="form-input" type="text" id="fThoigian" placeholder="VD: 9:00 - 11:00 hoặc Cả ngày">
    </div>
    <div class="form-group">
      <label class="form-label">Nội dung</label>
      <input class="form-input" type="text" id="fNoidung" placeholder="Mô tả nội dung công việc">
    </div>
    <div class="form-group">
      <label class="form-label">Địa điểm</label>
      <input class="form-input" type="text" id="fDiadiem" placeholder="VD: Hội trường A, Bên ngoài...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Chủ trì</label>
        <input class="form-input" type="text" id="fChutri" placeholder="Tên người chủ trì">
      </div>
      <div class="form-group">
        <label class="form-label">Thành phần tham dự</label>
        <input class="form-input" type="text" id="fThanhphan" placeholder="Danh sách người tham dự">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" style="color:var(--text-muted);border-color:var(--border);" onclick="closeLichModal()">Hủy</button>
      <button class="btn btn-success" onclick="saveLich()">💾 Lưu</button>
    </div>
  </div>
</div>

<!-- USERS MODAL -->
<div class="modal-overlay" id="usersModal">
  <div class="modal" style="width:420px;">
    <div class="modal-title">
      👥 Quản lý người dùng
      <button class="modal-close" onclick="closeUsersModal()">✕</button>
    </div>
    <div class="users-list" id="usersList"></div>
    <div style="border-top:1px solid var(--border);padding-top:16px;">
      <div style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.4px;">Thêm người dùng mới</div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Tên hiển thị</label>
          <input class="form-input" type="text" id="newUserName" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group">
          <label class="form-label">Mã PIN (4 số)</label>
          <input class="form-input" type="text" id="newUserPin" maxlength="4" placeholder="1234">
        </div>
      </div>
      <div class="modal-footer" style="margin-top:0;">
        <button class="btn btn-outline" style="color:var(--text-muted);border-color:var(--border);" onclick="closeUsersModal()">Đóng</button>
        <button class="btn btn-success" onclick="addUser()">➕ Thêm</button>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API = "https://script.google.com/macros/s/AKfycbywIJWlr6YVawBtwG-Pjl7_4ncV3maiuZFzNtmAvQYd7ha0g59p5mf4ZPxgwEZa0-4/exec";

let currentUser = null;
let isAdmin = false;
let allData = [];
let currentWeekOffset = 0;
let editingId = null;
let currentView = 'table';

const THU_MAP = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

// ── WEEK HELPERS ──
function getWeekDates(offset = 0) {
  const now = new Date();
  const day = now.getDay();
  const monday = new Date(now);
  monday.setDate(now.getDate() - (day === 0 ? 6 : day - 1) + offset * 7);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    days.push(d);
  }
  return days;
}

function fmtDate(d) {
  return d.toISOString().split('T')[0];
}

function displayDate(str) {
  if (!str) return '';
  const d = new Date(str + 'T00:00:00');
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

function updateWeekHeader() {
  const days = getWeekDates(currentWeekOffset);
  const s = days[0], e = days[6];
  document.getElementById('weekTitle').textContent =
    `Tuần ${getWeekNumber(s)} năm ${s.getFullYear()}`;
  document.getElementById('weekRange').textContent =
    `Từ ${displayDate(fmtDate(s))} đến ${displayDate(fmtDate(e))}/${e.getFullYear()}`;
}

function getWeekNumber(d) {
  const jan1 = new Date(d.getFullYear(), 0, 1);
  return Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
}

function changeWeek(dir) {
  if (dir === 0) currentWeekOffset = 0;
  else currentWeekOffset += dir;
  updateWeekHeader();
  renderView();
}

// ── FETCH DATA ──
function cleanRow(r) {
  // Chuẩn hóa ngày: lấy phần YYYY-MM-DD, bù timezone +7
  if (r.ngay && r.ngay.includes('T')) {
    const d = new Date(r.ngay);
    d.setHours(d.getHours() + 7);
    r.ngay = d.toISOString().split('T')[0];
  }
  // Chuẩn hóa thoigian: nếu là datetime thì bỏ
  if (r.thoigian && r.thoigian.includes('T')) {
    r.thoigian = '';
  }
  // id về string
  r.id = String(r.id);
  return r;
}

async function loadData() {
  try {
    const r = await fetch(`${API}?action=getLich`);
    const d = await r.json();
    allData = Array.isArray(d) ? d.map(cleanRow) : [];
  } catch(e) {
    allData = [];
  }
  renderView();
  document.getElementById('loadingTable').classList.add('hidden');
  document.getElementById('lichTable').classList.remove('hidden');
}

function getWeekData() {
  const days = getWeekDates(currentWeekOffset);
  const dates = days.map(d => fmtDate(d));
  return allData.filter(r => dates.includes(r.ngay));
}

// ── RENDER ──
function renderView() {
  if (currentView === 'table') renderTable();
  else renderCalendar();
}

function setView(v) {
  currentView = v;
  document.querySelectorAll('.view-tab').forEach((t,i) => {
    t.classList.toggle('active', (i===0 && v==='table') || (i===1 && v==='calendar'));
  });
  document.getElementById('tableView').classList.toggle('hidden', v !== 'table');
  document.getElementById('calendarView').classList.toggle('hidden', v !== 'calendar');
  renderView();
}

function renderTable() {
  const body = document.getElementById('lichBody');
  const data = getWeekData();
  const days = getWeekDates(currentWeekOffset);

  // Show actions column if logged in
  document.getElementById('actionsCol').classList.toggle('hidden', !currentUser);

  if (data.length === 0) {
    body.innerHTML = `<tr class="empty-row"><td colspan="8">📭 Không có lịch nào trong tuần này</td></tr>`;
    return;
  }

  // Sort by date then time
  data.sort((a,b) => (a.ngay||'').localeCompare(b.ngay||'') || (a.thoigian||'').localeCompare(b.thoigian||''));

  body.innerHTML = data.map(r => `
    <tr>
      <td class="td-ngay">${displayDate(r.ngay)}</td>
      <td class="td-thu">${r.thu||''}</td>
      <td><span class="td-time ${r.thoigian==='Cả ngày'?'ca-ngay':''}">${r.thoigian||''}</span></td>
      <td class="td-noidung">${r.noidung||''}</td>
      <td>${r.diadiem||''}</td>
      <td class="td-chutri">${r.chutri||''}</td>
      <td>${r.thanhphan||''}</td>
      ${currentUser ? `<td class="td-actions">
        <button class="btn btn-sm btn-primary" onclick="openEditModal('${r.id}')">✏️</button>
        <button class="btn btn-sm btn-danger" onclick="deleteLich('${r.id}')">🗑</button>
      </td>` : '<td class="hidden"></td>'}
    </tr>
  `).join('');
}

function renderCalendar() {
  const grid = document.getElementById('calendarGrid');
  const days = getWeekDates(currentWeekOffset);
  const todayStr = fmtDate(new Date());

  grid.innerHTML = days.map(day => {
    const dateStr = fmtDate(day);
    const dayData = allData.filter(r => r.ngay === dateStr);
    dayData.sort((a,b) => (a.thoigian||'').localeCompare(b.thoigian||''));
    const isToday = dateStr === todayStr;

    return `
      <div class="cal-day">
        <div class="cal-day-header ${isToday?'today':''}">
          <div class="cal-thu">${THU_MAP[day.getDay()]}</div>
          <div class="cal-date">${day.getDate()}/${day.getMonth()+1}</div>
        </div>
        <div class="cal-events">
          ${dayData.length === 0
            ? `<div class="cal-empty">Không có lịch</div>`
            : dayData.map(r => `
              <div class="cal-event">
                <div class="cal-event-time">${r.thoigian||''}</div>
                <div class="cal-event-title">${r.noidung||''}</div>
              </div>
            `).join('')
          }
        </div>
      </div>
    `;
  }).join('');
}

// ── PIN ──
function openPinModal() {
  ['p1','p2','p3','p4'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('pinError').textContent = '';
  document.getElementById('pinModal').classList.add('open');
  setTimeout(() => document.getElementById('p1').focus(), 100);
}
function closePinModal() { document.getElementById('pinModal').classList.remove('open'); }

function pinNext(el, nextId) {
  if (el.value.length >= 1 && nextId) {
    document.getElementById(nextId).focus();
  }
  if (!nextId && el.value.length >= 1) verifyPin();
}

async function verifyPin() {
  const pin = ['p1','p2','p3','p4'].map(id => document.getElementById(id).value).join('');
  if (pin.length < 4) { document.getElementById('pinError').textContent = 'Vui lòng nhập đủ 4 chữ số'; return; }

  try {
    const r = await fetch(`${API}?action=verifyPin&pin=${pin}`);
    const d = await r.json();
    if (d.success) {
      currentUser = d.ten;
      isAdmin = d.isAdmin;
      closePinModal();
      updateLoginState();
      showToast(`Xin chào, ${d.ten}! 👋`, 'success');
      renderView();
    } else {
      document.getElementById('pinError').textContent = '❌ Mã PIN không đúng, vui lòng thử lại';
      ['p1','p2','p3','p4'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('p1').focus();
    }
  } catch(e) {
    document.getElementById('pinError').textContent = 'Lỗi kết nối, thử lại sau';
  }
}

function logout() {
  currentUser = null; isAdmin = false;
  updateLoginState();
  renderView();
  showToast('Đã đăng xuất');
}

function updateLoginState() {
  const loggedIn = !!currentUser;
  document.getElementById('userBadge').classList.toggle('hidden', !loggedIn);
  document.getElementById('userName').textContent = currentUser || '';
  document.getElementById('btnAdmin').classList.toggle('hidden', !isAdmin);
  document.getElementById('btnAddLich').classList.toggle('hidden', !loggedIn);
  document.getElementById('btnLogin').classList.toggle('hidden', loggedIn);
  document.getElementById('btnLogout').classList.toggle('hidden', !loggedIn);
  document.getElementById('actionsCol').classList.toggle('hidden', !loggedIn);
}

// ── ADD/EDIT LICH ──
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = '➕ Thêm lịch mới';
  ['fNgay','fThu','fThoigian','fNoidung','fDiadiem','fChutri','fThanhphan'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('fNgay').addEventListener('change', autoFillThu);
  document.getElementById('lichModal').classList.add('open');
}

function openEditModal(id) {
  const row = allData.find(r => String(r.id) === String(id));
  if (!row) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = '✏️ Chỉnh sửa lịch';
  document.getElementById('fNgay').value = row.ngay || '';
  document.getElementById('fThu').value = row.thu || '';
  document.getElementById('fThoigian').value = row.thoigian || '';
  document.getElementById('fNoidung').value = row.noidung || '';
  document.getElementById('fDiadiem').value = row.diadiem || '';
  document.getElementById('fChutri').value = row.chutri || '';
  document.getElementById('fThanhphan').value = row.thanhphan || '';
  document.getElementById('fNgay').addEventListener('change', autoFillThu);
  document.getElementById('lichModal').classList.add('open');
}

function autoFillThu() {
  const val = document.getElementById('fNgay').value;
  if (val) {
    const d = new Date(val + 'T00:00:00');
    document.getElementById('fThu').value = THU_MAP[d.getDay()];
  }
}

function closeLichModal() { document.getElementById('lichModal').classList.remove('open'); }

async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(`${API}?${qs}`);
  return await r.json();
}

async function saveLich() {
  const ngay = document.getElementById('fNgay').value;
  const noidung = document.getElementById('fNoidung').value;
  if (!ngay || !noidung) { showToast('Vui lòng nhập Ngày và Nội dung', 'error'); return; }
  try {
    const d = await apiGet({
      action: editingId ? 'updateRow' : 'addRow',
      id: editingId || '',
      ngay,
      thu: document.getElementById('fThu').value,
      thoigian: document.getElementById('fThoigian').value,
      noidung,
      diadiem: document.getElementById('fDiadiem').value,
      chutri: document.getElementById('fChutri').value,
      thanhphan: document.getElementById('fThanhphan').value,
    });
    if (d.success) {
      closeLichModal();
      showToast(editingId ? 'Đã cập nhật lịch ✓' : 'Đã thêm lịch mới ✓', 'success');
      await loadData();
    } else { showToast('Lỗi lưu dữ liệu: ' + (d.error||''), 'error'); }
  } catch(e) { showToast('Lỗi kết nối', 'error'); }
}

async function deleteLich(id) {
  if (!confirm('Xác nhận xóa lịch này?')) return;
  try {
    const d = await apiGet({ action: 'deleteRow', id });
    if (d.success) { showToast('Đã xóa lịch ✓', 'success'); await loadData(); }
  } catch(e) { showToast('Lỗi xóa dữ liệu', 'error'); }
}

// ── USERS ──
async function openUsersModal() {
  const users = await apiGet({ action: 'getUsers' });
  document.getElementById('usersList').innerHTML = (Array.isArray(users)?users:[]).map(u => `
    <div class="user-row">
      <div class="user-info">
        <div class="user-name">${u.ten} ${u.ten==='Admin'?'<span class="admin-badge">ADMIN</span>':''}</div>
        <div class="user-pin">PIN: ${'•'.repeat(String(u.pin).length)}</div>
      </div>
      ${u.ten !== 'Admin' ? `<button class="btn btn-danger btn-sm" onclick="deleteUser('${u.pin}')">Xóa</button>` : ''}
    </div>
  `).join('');
  document.getElementById('usersModal').classList.add('open');
}
function closeUsersModal() { document.getElementById('usersModal').classList.remove('open'); }

async function addUser() {
  const ten = document.getElementById('newUserName').value.trim();
  const pin = document.getElementById('newUserPin').value.trim();
  if (!ten || !pin || pin.length !== 4 || isNaN(pin)) {
    showToast('Vui lòng nhập tên và PIN 4 chữ số hợp lệ', 'error'); return;
  }
  const d = await apiGet({ action: 'addUser', ten, pin });
  if (d.success) {
    document.getElementById('newUserName').value = '';
    document.getElementById('newUserPin').value = '';
    showToast(`Đã thêm người dùng ${ten} ✓`, 'success');
    openUsersModal();
  }
}

async function deleteUser(pin) {
  if (!confirm('Xác nhận xóa người dùng này?')) return;
  const d = await apiGet({ action: 'deleteUser', pin });
  if (d.success) { showToast('Đã xóa người dùng ✓', 'success'); openUsersModal(); }
}

// ── TOAST ──
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── INIT ──
updateWeekHeader();
loadData();
</script>
